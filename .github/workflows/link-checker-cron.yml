name: Scheduled Link Health Check

on:
  schedule:
    # Runs every 4 hours (at minute 0 past every 4th hour UTC)
    - cron: '0 */4 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Link Check Batch
        env:
          ADMIN_URL: ${{ secrets.ADMIN_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ADMIN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Error: ADMIN_APP_URL or CRON_SECRET is not configured in repository secrets."
            exit 1
          fi

          echo "Triggering link check batch against $ADMIN_URL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"batchSize": 50}' \
            "$ADMIN_URL/api/internal/link-check")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Scheduled check failed with status $HTTP_STATUS"
            exit 1
          fi
