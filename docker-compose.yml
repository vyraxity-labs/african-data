services:
  postgres:
    image: postgres:17
    container_name: african-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: african_data_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d african_data_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
